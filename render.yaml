services:
  # 1. Backend Service (Node.js)
  - type: web
    name: time-machine-backend
    env: node
    rootDir: backend/realtime-server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001

  # 2. Control Plane (Angular)
  - type: static
    name: time-machine-control-plane
    env: static
    rootDir: frontend/angular-admin
    # Magic Build Command: 
    # 1. Installs dependencies
    # 2. Builds the Angular app
    # 3. Creates the production env.js file dynamically using the Backend URL
    buildCommand: npm install && npm run build && echo "window.env = { backendUrl: '$BACKEND_URL' };" > dist/angular-admin/browser/assets/env.js
    publishDir: dist/angular-admin/browser
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: time-machine-backend
          property: url

  # 3. Analytics Dashboard (React)
  - type: static
    name: time-machine-analytics
    env: static
    rootDir: frontend/react-analytics
    buildCommand: npm install && npm run build
    publishDir: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: time-machine-backend
          property: url
