services:
  # 1. Backend Service (Node.js)
  - type: web
    name: time-machine-backend
    runtime: node
    rootDir: backend/realtime-server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: "3001"

  # 2. Control Plane (Angular) - Static Site
  - type: web
    name: time-machine-control-plane
    runtime: static
    rootDir: frontend/angular-admin
    # Magic Build Command: 
    # 1. Installs dependencies
    # 2. Builds the Angular app
    # 3. Creates the production env.js file dynamically using 'https://' + BACKEND_HOST
    buildCommand: |
      npm install && npm run build && echo "window.env = { backendUrl: 'https://$BACKEND_HOST' };" > dist/angular-admin/browser/assets/env.js
    staticPublishPath: dist/angular-admin/browser
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: time-machine-backend
          property: host

  # 3. Analytics Dashboard (React) - Static Site
  - type: web
    name: time-machine-analytics
    runtime: static
    rootDir: frontend/react-analytics
    # Construct Full URL for React
    buildCommand: |
      export REACT_APP_BACKEND_URL="https://$BACKEND_HOST"
      npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: time-machine-backend
          property: host
